name: UHML Build and Sync to Alist

# 定义触发条件：手动触发 (workflow_dispatch) 和 Release 发布 (release)
on:
    workflow_dispatch:
    release:
        types: [published]

# 定义环境变量
env:
    BUILD_OUTPUT_DIR: output

jobs:
    build_and_sync:
        runs-on: ubuntu-latest

        # 确保 secrets.WEBDAV_HOST 等 WebDAV 相关的 secrets 在您的仓库中已配置

        steps:
            # 1. 检出仓库代码 (使用 actions/checkout@v4 最新版本)
            - name: ⚙️ Checkout repository
              uses: actions/checkout@v4

            # # 2. 设置 Node.js 环境 (使用 actions/setup-node@v4 最新版本)
            # #    同时启用 pnpm 缓存
            # - name: 🟢 Setup Node.js & Cache
            #   uses: actions/setup-node@v4
            #   with:
            #       node-version: "22" # 请根据需要选择合适的 Node.js 版本
            #       cache: "pnpm" # 启用 pnpm 依赖缓存

            # 3. 设置 pnpm (使用 pnpm/action-setup@v3)
            #    这会取代你手动执行的 'npm install -g pnpm' 和 'pnpm setup'
            - name: 📦 Setup pnpm environment
              uses: pnpm/action-setup@v3
              with:
                  version: 8 # 指定 pnpm 版本
                  # 不需要 run_install, 因为你的代码中没有依赖安装步骤，只有全局安装

            # 4. 初始化 npm/pnpm 项目 (如果需要 package.json)
            #    注意：如果你的仓库中已经有 package.json，请删除此步骤。
            - name: 📦 Initialize pnpm project
              run: pnpm init

            # 5. 全局安装 uhmlbuilder 包并运行构建命令
            #    注意：我们假设包安装后会自动触发 postinstall 或你需要运行 uhmlbuilder
            - name: ⚙️🏗️ Install & Build
              run: |
                  # pnpm add -g 路径已经由 pnpm/action-setup 处理，无需 source
                  pnpm add -g @mclhomeplaza/uhml-builder

                  # 执行构建命令 (根据你的上下文，这可能是安装包的 CLI 命令)
                  uhmlbuilder

            # 6. 确认构建输出文件是否存在 (调试和检查)
            - name: 🔍 Check build output files
              run: |
                  echo "Listing contents of $BUILD_OUTPUT_DIR:"
                  # 检查目录是否存在，不存在则创建（可选）
                  if [ ! -d "$BUILD_OUTPUT_DIR" ]; then
                    echo "Error: Build output directory $BUILD_OUTPUT_DIR not found!"
                    exit 1
                  fi
                  ls -l $BUILD_OUTPUT_DIR/
                  if [ ! -f $BUILD_OUTPUT_DIR/Custom.xaml ]; then
                    echo "Error: output/Custom.xaml not found!"
                    exit 1
                  fi

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: build-output
                  path: output/
